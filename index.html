<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LikeLeaf Diary</title>
  <meta name="description" content="LikeLeaf Diary support and privacy information.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f1df;
      --card: #fffaf0;
      --ink: #2f3328;
      --muted: #6e725e;
      --leaf: #5f7f45;
      --line: #e4d8bd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #fff8e8 0, var(--bg) 42%, #efe3c9 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.75;
    }
    main {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }
    .card {
      background: rgba(255, 250, 240, 0.88);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(74, 58, 31, 0.12);
      padding: clamp(28px, 6vw, 56px);
    }
    .eyebrow {
      color: var(--leaf);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 12px;
      font-size: clamp(34px, 7vw, 62px);
      line-height: 1.04;
      letter-spacing: -0.04em;
    }
    p { margin: 0 0 18px; }
    .lead {
      color: var(--muted);
      font-size: clamp(17px, 2.4vw, 20px);
      max-width: 620px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      color: var(--leaf);
      font-weight: 800;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 18px;
      border: 1px solid #c6d2a4;
      border-radius: 999px;
      background: #eff5dc;
      color: #425d2e;
      text-decoration: none;
    }
    footer {
      color: var(--muted);
      font-size: 13px;
      margin-top: 22px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="eyebrow">LikeLeaf Diary</div>
      <h1>写真とひとことで、今日を残す。</h1>
      <p class="lead">LikeLeaf Diary は、写真を選んで短いメモを添えるだけで、日々の記録を続けやすくする写真日記アプリです。</p>
      <div class="links">
        <a class="button" href="./support/">サポート</a>
        <a class="button" href="./privacy/">プライバシーポリシー</a>
      </div>
    </section>
    <footer>Copyright 2026 Takuya Maeda</footer>
  </main>
</body>
</html>
